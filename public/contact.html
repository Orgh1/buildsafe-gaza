<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — BuildSafe Gaza</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <script>(function(){var ar=localStorage.getItem('bsg_lang')==='ar';var d=document.documentElement;d.lang=ar?'ar':'en';d.dir=ar?'rtl':'ltr';document.write('<link rel="stylesheet" href="/vendor/bootstrap/bootstrap'+(ar?'.rtl':'')+'.min.css">');})();</script>
  <link rel="stylesheet" href="/vendor/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app-nav"></div>
  <main class="container page mx-auto my-4" style="max-width:640px">
    <h3 class="fw-bold mb-1"><i class="bi bi-envelope text-bsg"></i> Contact Us</h3>
    <p class="text-muted">Questions, feedback, or partnership requests? Send us a message.</p>

    <div class="card p-4">
      <div id="ok" class="alert alert-success d-none"></div>
      <div id="error" class="alert alert-danger d-none"></div>
      <form id="contact-form">
        <div class="mb-3"><label class="form-label required">Name</label><input class="form-control" id="name" required></div>
        <div class="mb-3"><label class="form-label required">Email</label><input type="email" class="form-control" id="email" required></div>
        <div class="mb-3"><label class="form-label">Subject</label><input class="form-control" id="subject"></div>
        <div class="mb-3"><label class="form-label required">Message</label><textarea class="form-control" id="message" rows="4" required></textarea></div>
        <button class="btn btn-bsg" type="submit" id="submit-btn"><i class="bi bi-send"></i> Send message</button>
      </form>
    </div>
  </main>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/idb.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/sync.js"></script>
  <script>
    (async () => {
      await BSG.ui.loadUser();
      BSG.ui.renderNav('contact');
      BSG.ui.initConnectivity();
      BSG.ui.registerSW();
      const form = document.getElementById('contact-form');
      const ok = document.getElementById('ok');
      const err = document.getElementById('error');
      const btn = document.getElementById('submit-btn');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        ok.classList.add('d-none'); err.classList.add('d-none');
        btn.disabled = true;
        try {
          const r = await BSG.api.post('/api/contact', {
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            subject: document.getElementById('subject').value.trim(),
            message: document.getElementById('message').value.trim(),
          });
          ok.textContent = BSG.i18n.t(r.message || 'Message sent.'); ok.classList.remove('d-none');
          form.reset();
        } catch (ex) {
          err.textContent = ex.message; err.classList.remove('d-none');
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
