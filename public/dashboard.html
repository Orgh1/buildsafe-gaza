<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — BuildSafe Gaza</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" id="bs-css" href="/vendor/bootstrap/bootstrap.min.css">
  <script>(function(){try{var ar=localStorage.getItem('bsg_lang')==='ar';var e=document.documentElement;e.lang=ar?'ar':'en';e.dir=ar?'rtl':'ltr';if(ar){var l=document.getElementById('bs-css');if(l)l.href='/vendor/bootstrap/bootstrap.rtl.min.css';}}catch(_){}})();</script>
  <link rel="stylesheet" href="/vendor/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app-nav"></div>
  <main class="container page mx-auto my-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <div>
        <h3 class="fw-bold mb-0" id="welcome">Dashboard</h3>
        <span class="text-muted small" id="scope-label"></span>
      </div>
      <a href="/assessment.html" class="btn btn-bsg"><i class="bi bi-plus-lg"></i> New Assessment</a>
    </div>

    <div id="sync-banner" class="alert alert-warning d-none d-flex justify-content-between align-items-center">
      <span><i class="bi bi-cloud-arrow-up"></i> <span id="pending-text"></span></span>
      <button class="btn btn-sm btn-warning" id="sync-now">Sync now</button>
    </div>

    <div class="row g-3 mb-4" id="stat-cards"></div>

    <div class="card">
      <div class="card-header bg-white fw-bold"><i class="bi bi-clock-history text-bsg"></i> Recent Assessments</div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table mb-0 align-middle">
            <thead class="table-light"><tr><th>ID</th><th>Location</th><th>Severity</th><th>Status</th><th>Date</th><th></th></tr></thead>
            <tbody id="recent-body"><tr><td colspan="6" class="text-center text-muted py-4">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/idb.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/sync.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
